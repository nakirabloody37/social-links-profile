<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Social links profile</title>
  </head>

  <body>
    <main class="social-links-profile">
      <img
        class="profile-picture"
        src="pfp.jpg"
        alt="profile picture of NAkira"
      />
      <div class="heading">
        <h1 class="heading-primary">NAkira</h1>
        <p class="place">Addis Ababa, Ethiopia</p>
      </div>
      <blockquote class="profile-description">
        "Front-end developer and gaming enthusiast."
      </blockquote>
      <nav class="social-links">
        <ul class="social-links-list">
          <li><a class="social-link" href="#">GitHub</a></li>
          <li><a class="social-link" href="#">Frontend Mentor</a></li>
          <li><a class="social-link" href="#">LinkedIn</a></li>
          <li><a class="social-link" href="#">Twitter</a></li>
          <li><a class="social-link" href="#">Instagram</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
